# Cabeceras de los ARCHIVOS que la intranet muestra dentro de sus propias páginas (el lector de
# boletines pone el PDF en un <iframe>): /api/files/… y los PDF de /sitio/. Se incluyen con un `if`
# dentro de esas ubicaciones y reemplazan a las de seguridad.conf.
# `npm run preview` las aplica igual (vite.config.ts).
#
# Qué cambia respecto a seguridad.conf:
#  - frame-ancestors 'self' y X-Frame-Options SAMEORIGIN: solo la propia intranet puede enmarcarlos
#    (desde otro sitio, sigue prohibido).
#  - Sin default-src ni object-src: el visor de PDF del navegador es un plugin y esa política lo
#    bloquea. Es seguro porque estas rutas solo sirven PDF e imágenes (la API los reconoce por sus
#    primeros bytes) con nosniff: no hay HTML ni scripts que una política tenga que contener.
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
