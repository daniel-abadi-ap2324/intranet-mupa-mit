# Cabeceras de seguridad de la intranet. Se incluyen en el server y en cada
# location que agrega sus propias cabeceras (en nginx, un add_header dentro de
# una location anula los del server si no se repiten).
# `npm run preview` lee este mismo archivo (vite.config.ts): mantener el formato
#   add_header Nombre "valor" always;
#
# CSP: todo sale del propio sitio (la SPA no carga scripts, fuentes ni imágenes
# de afuera; los enlaces a otros sistemas son navegación, no recursos).
# 'unsafe-inline' en estilos solo por atributos style="" de algunos componentes.
# HSTS no va aquí: lo pone quien termine HTTPS (el proxy de IT).

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
